<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Dashboard - 系统仪表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            color: white;
            font-size: 2em;
            margin-bottom: 5px;
        }

        header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .stat-card h3 {
            color: #a0aec0;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #61dafb;
        }

        .stat-card .label {
            color: #7aa2f7;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #2d3748;
            padding-bottom: 2px;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #7aa2f7;
            cursor: pointer;
            font-size: 1em;
            border-radius: 5px 5px 0 0;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: #1a1a2e;
            color: #c9d1d9;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-bar input,
        .filter-bar select {
            padding: 10px 15px;
            background: #1a1a2e;
            border: 1px solid #2d3748;
            border-radius: 5px;
            color: #c9d1d9;
            font-size: 0.9em;
        }

        .filter-bar input:focus,
        .filter-bar select:focus {
            outline: none;
            border-color: #667eea;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .item-card {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .item-card:hover {
            background: #232d42;
            transform: translateX(5px);
        }

        .item-card .name {
            font-weight: bold;
            color: #61dafb;
            margin-bottom: 8px;
        }

        .item-card .category {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 0.8em;
            margin-bottom: 10px;
        }

        .item-card .description {
            color: #a0aec0;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-badge.active {
            background: #10b981;
            color: white;
        }

        .status-badge.ready {
            background: #f59e0b;
            color: white;
        }

        .status-badge.inactive {
            background: #64748b;
            color: white;
        }

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .server-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a2e;
            padding: 15px 20px;
            border-radius: 8px;
        }

        .server-item .info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .server-item .name {
            font-weight: bold;
            color: #61dafb;
        }

        .server-item .type {
            color: #7aa2f7;
            font-size: 0.9em;
        }

        .server-item .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7aa2f7;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .refresh-indicator {
            display: inline-block;
            margin-left: 10px;
            color: #10b981;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .refresh-indicator.loading::after {
            content: '↻';
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 System Dashboard</h1>
            <p>系统仪表板 - Skills & MCP 集成管理</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>📦 Skills</h3>
                <div class="value" id="skills-total">-</div>
                <div class="label">总技能数</div>
            </div>
            <div class="stat-card">
                <h3>🔌 MCP</h3>
                <div class="value" id="mcp-total">-</div>
                <div class="label">服务器数</div>
            </div>
            <div class="stat-card">
                <h3>⏱️️ Uptime</h3>
                <div class="value" id="uptime">-</div>
                <div class="label">运行时间</div>
            </div>
            <div class="stat-card">
                <h3>📊 Status</h3>
                <div class="value" id="status-indicator">🟢</div>
                <div class="label">系统状态</div>
            </div>
        </div>

        <div class="quick-actions">
            <button class="btn" onclick="refreshData()">🔄 刷新</button>
            <button class="btn" onclick="exportConfig()">💾 导出配置</button>
            <button class="btn" onclick="showHelp()">📖 帮助</button>
            <span class="refresh-indicator" id="auto-refresh">自动刷新: 开</span>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('skills')">📦 Skills</button>
            <button class="tab" onclick="showTab('mcp')">🔌 MCP 服务器</button>
            <button class="tab" onclick="showTab('categories')">📂 分类浏览</button>
        </div>

        <div id="skills-content" class="tab-content active">
            <div class="filter-bar">
                <input type="text" id="search-input" placeholder="🔍 搜索 skills..." oninput="filterSkills()">
                <select id="category-filter" onchange="filterSkills()">
                    <option value="">所有分类</option>
                    <option value="Obsidian">Obsidian</option>
                    <option value="AgentDB">AgentDB</option>
                    <option value="GitHub">GitHub</option>
                    <option value="Flow-Nexus">Flow-Nexus</option>
                    <option value="SPARC">SPARC</option>
                </select>
            </div>
            <div class="items-grid" id="skills-grid">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <div id="mcp-content" class="tab-content">
            <div class="server-list" id="mcp-list">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <div id="categories-content" class="tab-content">
            <div class="stats-grid" id="categories-grid">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentTab = 'skills';
        let allSkills = [];
        let allMcpServers = [];

        // 初始化 WebSocket 连接
        function initWebSocket() {
            ws = new WebSocket('ws://localhost:8080');

            ws.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('status-indicator').textContent = '🟢';
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleWebSocketMessage(message);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected, reconnecting...');
                document.getElementById('status-indicator').textContent = '🟡';
                setTimeout(initWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                document.getElementById('status-indicator').textContent = '🔴';
            };
        }

        function handleWebSocketMessage(message) {
            if (message.type === 'status-updated') {
                updateStats(message.data);
            }
        }

        // 更新统计信息
        function updateStats(data) {
            document.getElementById('skills-total').textContent = data.skills.total;
            document.getElementById('mcp-total').textContent = data.mcp.total;
            document.getElementById('uptime').textContent = data.system.uptime;

            if (data.skills.categories) {
                updateCategories(data.skills.categories);
            }
        }

        function updateCategories(categories) {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = '';

            for (const [name, count] of Object.entries(categories)) {
                grid.innerHTML += `
                    <div class="stat-card">
                        <h3>${getCategoryEmoji(name)} ${name}</h3>
                        <div class="value">${count}</div>
                        <div class="label">技能数量</div>
                    </div>
                `;
            }
        }

        function getCategoryEmoji(category) {
            const emojis = {
                'Obsidian': '📝',
                'AgentDB': '🤖',
                'GitHub': '🐙',
                'Flow-Nexus': '☁️️',
                'SPARC': '🔧'
            };
            return emojis[category] || '📦';
        }

        // 标签页切换
        function showTab(tabName) {
            currentTab = tabName;

            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`${tabName}-content`).classList.add('active');

            if (tabName === 'skills' && allSkills.length === 0) {
                loadSkills();
            } else if (tabName === 'mcp' && allMcpServers.length === 0) {
                loadMcpServers();
            }
        }

        // 加载数据
        async function loadData() {
            try {
                const [statusRes, skillsRes, mcpRes] = await Promise.all([
                    fetch('/api/status'),
                    fetch('/api/skills'),
                    fetch('/api/mcp')
                ]);

                const status = await statusRes.json();
                updateStats(status);

                allSkills = (await skillsRes.json()).skills;
                allMcpServers = (await mcpRes.json()).servers;

                if (currentTab === 'skills') renderSkills(allSkills);
                if (currentTab === 'mcp') renderMcpServers(allMcpServers);
            } catch (error) {
                console.error('Failed to load data:', error);
            }
        }

        function loadSkills() {
            renderSkills(allSkills);
        }

        function loadMcpServers() {
            renderMcpServers(allMcpServers);
        }

        // 渲染 Skills
        function renderSkills(skills) {
            const grid = document.getElementById('skills-grid');
            grid.innerHTML = skills.map(skill => `
                <div class="item-card">
                    <div class="category">${skill.category}</div>
                    <div class="name">${skill.name}</div>
                    <div class="description">${skill.description}</div>
                </div>
            `).join('');
        }

        // 渲染 MCP 服务器
        function renderMcpServers(servers) {
            const list = document.getElementById('mcp-list');
            list.innerHTML = servers.map(server => `
                <div class="server-item">
                    <div class="info">
                        <div>
                            <div class="name">${server.name}</div>
                            <div class="type">${server.type} • ${server.command}</div>
                        </div>
                        <span class="status-badge ${server.status === 'active' ? 'active' : 'ready'}">
                            ${server.status === 'active' ? '运行中' : '就绪'}
                        </span>
                    </div>
                    <div class="actions">
                        <button class="btn btn-sm" onclick="toggleServer('${server.name}')">
                            ${server.enabled ? '禁用' : '启用'}
                        </button>
                        <button class="btn btn-sm">配置</button>
                    </div>
                </div>
            `).join('');
        }

        // 过滤 Skills
        function filterSkills() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-filter').value;

            const filtered = allSkills.filter(skill => {
                const matchesSearch = skill.name.toLowerCase().includes(searchTerm) ||
                    skill.description.toLowerCase().includes(searchTerm);
                const matchesCategory = !category || skill.category === category;
                return matchesSearch && matchesCategory;
            });

            renderSkills(filtered);
        }

        // 刷新数据
        function refreshData() {
            const indicator = document.getElementById('auto-refresh');
            indicator.classList.add('loading');
            loadData().then(() => {
                indicator.classList.remove('loading');
            });
        }

        // 导出配置
        async function exportConfig() {
            try {
                const config = await fetch('/api/config').then(r => r.json());
                const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'dashboard-config.json';
                a.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                alert('导出失败: ' + error.message);
            }
        }

        // 显示帮助
        function showHelp() {
            alert(`System Dashboard 帮助

快捷键:
- Ctrl+R: 刷新数据
- Ctrl+E: 导出配置
- Ctrl+H: 显示帮助

更多信息请访问: https://github.com/your-repo/system-dashboard`);
        }

        // 初始化
        initWebSocket();
        loadData();
        setInterval(loadData, 30000); // 每30秒自动刷新
    </script>
</body>
</html>
