<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b4a"/>
      <stop offset="50%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#9d7aff"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- AI text -->
  <text x="24" y="28" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="url(#textGradient)" text-anchor="middle" filter="url(#glow)">AI</text>

  <!-- Sparkle decorations -->
  <circle cx="36" cy="12" r="3" fill="white" opacity="0.8"/>
  <circle cx="38" cy="14" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="12" cy="36" r="2" fill="white" opacity="0.5"/>
</svg>