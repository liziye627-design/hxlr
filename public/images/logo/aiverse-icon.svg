<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b4a"/>
      <stop offset="33%" style="stop-color:#ff8a6d"/>
      <stop offset="66%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#9d7aff"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.4)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Main background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#mainGradient)" filter="url(#dropShadow)"/>

  <!-- Inner highlight -->
  <rect x="12" y="12" width="104" height="52" rx="24" fill="url(#innerGlow)" opacity="0.5"/>

  <!-- AI letters -->
  <text x="64" y="75" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="white" text-anchor="middle" filter="url(#innerShadow)">AI</text>

  <!-- Decorative elements -->
  <!-- Top right sparkle -->
  <g transform="translate(88, 24)">
    <circle cx="0" cy="0" r="6" fill="white" opacity="0.9"/>
    <circle cx="8" cy="4" r="3" fill="white" opacity="0.6"/>
    <circle cx="4" cy="10" r="2" fill="white" opacity="0.4"/>
  </g>

  <!-- Bottom left dots -->
  <circle cx="32" cy="96" r="4" fill="white" opacity="0.5"/>
  <circle cx="24" cy="88" r="2" fill="white" opacity="0.3"/>

  <!-- Gaming icon hint -->
  <circle cx="96" cy="96" r="12" fill="rgba(255,255,255,0.15)"/>
  <text x="96" y="100" font-size="12" text-anchor="middle" fill="white" opacity="0.8">🎮</text>
</svg>